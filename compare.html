<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Players — Asian Tier List [1.8+]</title>
<meta name="description" content="Compare two players' tiers side by side.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<main>
  <section class="page-hero">
    <div class="container">
      <div class="eyebrow">Head to head</div>
      <h1 class="h-title" style="font-size:clamp(32px,5vw,52px);">Compare Players</h1>
      <p class="h-sub" style="max-width:640px;">Put two players side by side — tiers, gamemodes, and (once connected) live server stats.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="glass card">
        <div class="grid-2">
          <div class="field" style="margin-bottom:0;">
            <label style="color:var(--blue-400);">Player A</label>
            <input class="input" id="inputA" placeholder="Discord or Minecraft username">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label style="color:var(--red-400);">Player B</label>
            <input class="input" id="inputB" placeholder="Discord or Minecraft username">
          </div>
        </div>
        <button class="btn btn-primary btn-block mt-16" id="compareBtn">Compare</button>
      </div>

      <div class="mt-32" id="compareResult"></div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/session.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/backgrounds.js"></script>
<script src="assets/js/cursor.js"></script>
<script type="module">
  window.ATL_skinFallback = function(img, mcUsername){
    const seed = mcUsername || 'guest';
    img.onerror = null;
    img.src = `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(seed)}&backgroundColor=141a29`;
  };

  ATL_mountBackground('compare');
  ATL_initShell('compare.html');

  const resultEl = document.getElementById('compareResult');

  async function findPlayer(query){
    query = query.trim().toLowerCase();
    if(!query) return null;
    const [known, staff, testers, mcLinks] = await Promise.all([
      ATL_SESSION.loadStore('known_users', { byUsername:{}, byId:{} }),
      ATL_SESSION.loadStore('staff', []),
      ATL_SESSION.loadStore('testers', []),
      ATL_SESSION.loadStore('mc_usernames', {})
    ]);

    // exact username match on a real account first
    let account = known.byUsername && known.byUsername[query];
    // else match by linked minecraft username
    if(!account){
      const mcMatchId = Object.keys(mcLinks).find(id => (mcLinks[id]||'').toLowerCase() === query);
      if(mcMatchId && known.byId) account = known.byId[mcMatchId];
    }
    if(account){
      const tierRecord = await ATL_SESSION.loadStore('tier_'+account.id, null);
      return { discordId: account.id, username: account.username, display: account.display, avatar: account.avatar, mcUsername: mcLinks[account.id]||'', roles: account.roles && account.roles.length ? account.roles : (account.role?[account.role]:[]), tierRecord };
    }

    // fall back to staff/tester roster (may not have a real login yet)
    const rosterMatch = staff.find(s=>s.username.toLowerCase()===query) || testers.find(t=>t.username.toLowerCase()===query);
    if(rosterMatch){
      return { discordId:null, username: rosterMatch.username, display: rosterMatch.display||rosterMatch.username, avatar:null, mcUsername: rosterMatch.mcUsername||'', roles:[rosterMatch.role||rosterMatch.rank], tierRecord:null };
    }
    return null;
  }

  function playerColumn(p, color, label){
    if(!p){
      return `<div class="glass card" style="text-align:center; border-color:rgba(${color},.25);">
        <div class="eyebrow" style="justify-content:center; color:rgb(${color});">${label}</div>
        <div class="empty-state" style="padding:40px 12px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <h3 style="font-size:16px;">Not found</h3>
        </div>
      </div>`;
    }
    return `<div class="glass card" style="text-align:center; border-color:rgba(${color},.3);">
      <div class="eyebrow" style="justify-content:center; color:rgb(${color});">${label}</div>
      <div style="display:flex; justify-content:center; margin:16px 0;">
        ${p.mcUsername
          ? `<img class="avatar-sq" src="${ATL_DATA.mcBodyUrl(p.mcUsername,7)}" alt="Minecraft skin of ${p.mcUsername}" style="height:150px; image-rendering:pixelated;" onerror="ATL_skinFallback(this,'${p.mcUsername.replace(/'/g,"")}')">`
          : `<img class="avatar-sq" src="${p.avatar || `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(p.username)}&backgroundColor=141a29`}" alt="${p.username}" style="width:96px;height:96px;object-fit:cover;">`}
      </div>
      <div style="font-family:var(--f-sub); font-weight:700; font-size:17px; color:var(--text-0);">${p.display}</div>
      <div class="text-sm text-muted mono">@${p.username}</div>
      <div class="mt-8" style="display:flex; gap:6px; flex-wrap:wrap; justify-content:center;">
        ${(p.roles||[]).filter(Boolean).map(r=>ATL_roleBadge(r)).join('')}
      </div>
      <div class="mt-16">
        <div class="text-sm text-muted">Overall tier</div>
        <div class="mt-8" style="display:flex; justify-content:center;">${p.tierRecord && p.tierRecord.overall ? ATL_hex(p.tierRecord.overall) : '<span class="text-muted text-sm">Not yet tested</span>'}</div>
      </div>
    </div>`;
  }

  document.getElementById('compareBtn').addEventListener('click', async ()=>{
    resultEl.innerHTML = `<div class="glass empty-state"><p class="text-sm text-muted">Comparing…</p></div>`;
    const [a, b] = await Promise.all([
      findPlayer(document.getElementById('inputA').value),
      findPlayer(document.getElementById('inputB').value)
    ]);

    if(!a && !b){
      resultEl.innerHTML = `<div class="glass empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <h3>Neither player found</h3>
        <p>Enter usernames for players who have signed in, or been added as staff/testers.</p>
      </div>`;
      return;
    }

    const gmRows = ATL_DATA.GAMEMODES.map(g=>{
      const ta = a && a.tierRecord && a.tierRecord.gamemodes[g.id];
      const tb = b && b.tierRecord && b.tierRecord.gamemodes[g.id];
      return `<tr>
        <td style="text-align:center;">${ta ? ATL_hex(ta,'sm') : '<span class="text-muted text-sm">—</span>'}</td>
        <td class="text-muted" style="text-align:center;">${g.label}</td>
        <td style="text-align:center;">${tb ? ATL_hex(tb,'sm') : '<span class="text-muted text-sm">—</span>'}</td>
      </tr>`;
    }).join('');

    const statRows = ['ELO / Rating','Wins','Losses','K/D','Win rate','Games played'].map(label=>`
      <tr><td style="text-align:center;" class="text-muted mono">N/A</td><td class="text-muted" style="text-align:center;">${label}</td><td style="text-align:center;" class="text-muted mono">N/A</td></tr>
    `).join('');

    resultEl.innerHTML = `
      <div class="grid-2">
        ${playerColumn(a, '58,134,255', 'Player A')}
        ${playerColumn(b, '230,57,70', 'Player B')}
      </div>

      <div class="glass card mt-24">
        <div class="eyebrow">Gamemode tiers</div>
        <div class="table-wrap mt-16"><table class="dt"><tbody>${gmRows}</tbody></table></div>
      </div>

      <div class="glass card mt-24">
        <div class="eyebrow">Server statistics</div>
        <p class="text-sm text-muted mt-8">These come from live server stats and aren't connected yet, so they show N/A rather than made-up numbers.</p>
        <div class="table-wrap mt-16"><table class="dt"><tbody>${statRows}</tbody></table></div>
      </div>
    `;
  });
</script>
</body>
</html>
