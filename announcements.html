<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements · Asian Tier List [1.8+]</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📢</text></svg>">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .announcements-hero {
            text-align: center;
            padding: 30px 20px 20px;
        }
        .announcements-hero h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: var(--font-weight-extrabold);
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .announcements-hero p {
            color: var(--color-text-secondary);
            font-size: 1.1rem;
            margin-top: 4px;
        }

        .announcements-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .announcement-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            border: 1px solid var(--color-border);
            backdrop-filter: blur(10px);
            margin-bottom: var(--spacing-lg);
            transition: all var(--transition-normal);
        }
        .announcement-card:hover {
            border-color: var(--color-border-light);
            box-shadow: var(--shadow-lg);
        }
        .announcement-card.important {
            border-color: var(--color-red);
            border-width: 2px;
        }
        .announcement-card.important::before {
            content: '📌 IMPORTANT';
            display: inline-block;
            font-size: 0.7rem;
            font-weight: var(--font-weight-bold);
            color: var(--color-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--spacing-sm);
        }

        .announcement-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
        }
        .announcement-card .meta .category {
            display: inline-block;
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: var(--font-weight-semibold);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .announcement-card .meta .category.general { background: var(--color-blue); color: white; }
        .announcement-card .meta .category.update { background: #22c55e; color: white; }
        .announcement-card .meta .category.event { background: #f59e0b; color: white; }
        .announcement-card .meta .category.important { background: var(--color-red); color: white; }

        .announcement-card .meta .date {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
        }

        .announcement-card h2 {
            font-size: 1.3rem;
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-sm);
            color: var(--color-text);
        }

        .announcement-card .content {
            color: var(--color-text-secondary);
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .announcement-card .author {
            margin-top: var(--spacing-md);
            font-size: 0.85rem;
            color: var(--color-text-tertiary);
            border-top: 1px solid var(--color-border);
            padding-top: var(--spacing-md);
        }

        .no-announcements {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-secondary);
        }
        .no-announcements .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px 20px;
        }
        .loading-spinner .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .discord-link {
            text-align: center;
            padding: var(--spacing-xl);
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            margin-top: var(--spacing-xl);
        }
        .discord-link h3 {
            font-size: 1.1rem;
            margin-bottom: var(--spacing-sm);
        }
        .discord-link p {
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-md);
        }
        .discord-link .btn {
            display: inline-block;
            padding: 10px 28px;
            background: #5865F2;
            color: white;
            border-radius: var(--radius-full);
            text-decoration: none;
            font-weight: var(--font-weight-bold);
            transition: all var(--transition-fast);
        }
        .discord-link .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.3);
        }

        @media (max-width: 480px) {
            .announcement-card {
                padding: var(--spacing-md);
            }
            .announcement-card h2 {
                font-size: 1.1rem;
            }
            .announcement-card .meta {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <nav id="main-nav"></nav>

        <div class="announcements-hero">
            <h1>📢 Announcements</h1>
            <p>Stay up to date with the latest news</p>
        </div>

        <div class="announcements-container">
            <div id="announcements-content">
                <div class="loading-spinner" id="announcements-loading">
                    <div class="spinner"></div>
                    <p>Loading announcements...</p>
                </div>
                <div id="announcements-list">
                    <!-- Filled by JS -->
                </div>
            </div>

            <!-- Discord Link -->
            <div class="discord-link">
                <h3>💬 Join Our Discord</h3>
                <p>Get real-time announcements and updates in our Discord server</p>
                <a href="https://discord.com/" class="btn" target="_blank">Join Discord</a>
            </div>
        </div>

        <footer id="main-footer"></footer>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/backgrounds.js"></script>
    <script>
        // ============================================================
        // ANNOUNCEMENTS LOGIC
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const loading = document.getElementById('announcements-loading');
            const list = document.getElementById('announcements-list');

            async function loadAnnouncements() {
                try {
                    const announcements = await window.ATL_SESSION.loadStore('announcements', []);
                    
                    loading.style.display = 'none';

                    if (!announcements || announcements.length === 0) {
                        list.innerHTML = `
                            <div class="no-announcements">
                                <div class="icon">📢</div>
                                <p>No announcements have been posted yet.</p>
                                <p style="font-size: 0.85rem; margin-top: 4px;">Check back later for updates!</p>
                            </div>
                        `;
                        return;
                    }

                    // Sort by date (newest first)
                    const sorted = [...announcements].sort((a, b) => new Date(b.date) - new Date(a.date));

                    list.innerHTML = sorted.map(a => {
                        const isImportant = a.category === 'important';
                        const categoryClass = a.category || 'general';
                        const date = new Date(a.date).toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });
                        const time = new Date(a.date).toLocaleTimeString('en-US', {
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                        return `
                            <div class="announcement-card ${isImportant ? 'important' : ''}">
                                <div class="meta">
                                    <span class="category ${categoryClass}">${a.category || 'General'}</span>
                                    <span class="date">${date} · ${time}</span>
                                </div>
                                <h2>${a.title}</h2>
                                <div class="content">${a.content}</div>
                                <div class="author">
                                    Posted by ${a.author || 'Staff'} 
                                    ${a.authorId ? '· <span style="color: var(--color-text-tertiary);">' + a.authorId + '</span>' : ''}
                                </div>
                            </div>
                        `;
                    }).join('');

                } catch (error) {
                    console.error('Error loading announcements:', error);
                    loading.innerHTML = `
                        <div class="error-message" style="text-align:center; padding:30px; color: var(--color-red);">
                            <div class="icon" style="font-size:2.5rem; margin-bottom:10px;">❌</div>
                            <p>Failed to load announcements: ${error.message}</p>
                        </div>
                    `;
                }
            }

            loadAnnouncements();

            // Reload on session update (in case new announcements were added)
            window.addEventListener('session-update', loadAnnouncements);

            // Auto-refresh every 60 seconds
            setInterval(loadAnnouncements, 60000);
        });
    </script>
</body>
</html>
