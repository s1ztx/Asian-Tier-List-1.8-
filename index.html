<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile · Asian Tier List [1.8+]</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .profile-hero {
            text-align: center;
            padding: 40px 20px 30px;
            position: relative;
        }
        .profile-hero h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: var(--font-weight-extrabold);
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .profile-hero p {
            color: var(--color-text-secondary);
            font-size: 1.1rem;
            margin-top: 4px;
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-xl);
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            border: 1px solid var(--color-border);
            backdrop-filter: blur(10px);
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
        }
        .profile-header .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--color-border);
            overflow: hidden;
            flex-shrink: 0;
            image-rendering: pixelated;
        }
        .profile-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-header .info {
            flex: 1;
            min-width: 200px;
        }
        .profile-header .info .name {
            font-size: 1.8rem;
            font-weight: var(--font-weight-extrabold);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }
        .profile-header .info .discord {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            margin-top: 2px;
        }
        .profile-header .info .tier-display {
            margin-top: var(--spacing-sm);
            font-size: 2.5rem;
            font-weight: var(--font-weight-extrabold);
        }
        .profile-header .info .role-badge {
            font-size: 0.8rem;
            padding: 4px 14px;
        }

        .profile-header .stats-quick {
            display: flex;
            gap: var(--spacing-xl);
            flex-wrap: wrap;
        }
        .profile-header .stats-quick .stat {
            text-align: center;
        }
        .profile-header .stats-quick .stat .num {
            font-size: 1.5rem;
            font-weight: var(--font-weight-extrabold);
            color: var(--color-text);
        }
        .profile-header .stats-quick .stat .label {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Profile Grid */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }

        .profile-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            border: 1px solid var(--color-border);
            backdrop-filter: blur(10px);
        }
        .profile-card.full-width {
            grid-column: 1 / -1;
        }
        .profile-card h2 {
            font-size: 1.1rem;
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        .profile-card h2 .badge {
            font-size: 0.7rem;
            background: var(--color-blue);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Gamemode Tiers */
        .gamemode-tier-list {
            display: grid;
            gap: var(--spacing-sm);
        }
        .gamemode-tier-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--color-background);
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
        }
        .gamemode-tier-item .gm {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-weight: var(--font-weight-medium);
        }
        .gamemode-tier-item .tier {
            font-weight: var(--font-weight-bold);
            font-size: 1.1rem;
        }

        /* Tier History */
        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--color-border);
            font-size: 0.9rem;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-item .date {
            color: var(--color-text-secondary);
            font-size: 0.8rem;
        }
        .history-item .change {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        .history-item .change .arrow {
            color: var(--color-text-secondary);
        }
        .history-item .change .old {
            color: var(--color-text-tertiary);
            text-decoration: line-through;
        }
        .history-item .change .new {
            font-weight: var(--font-weight-bold);
        }

        /* Stats Grid */
        .stats-grid-profile {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: var(--spacing-sm);
        }
        .stats-grid-profile .stat-box {
            text-align: center;
            padding: var(--spacing-sm);
            background: var(--color-background);
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
        }
        .stats-grid-profile .stat-box .num {
            font-size: 1.3rem;
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
        }
        .stats-grid-profile .stat-box .label {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .no-data {
            text-align: center;
            padding: 30px 20px;
            color: var(--color-text-secondary);
        }
        .no-data .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-text-secondary);
        }
        .loading-spinner .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 30px 20px;
            color: var(--color-red);
        }
        .error-message .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* Login Prompt */
        .login-prompt {
            text-align: center;
            padding: 60px 20px;
        }
        .login-prompt .icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }
        .login-prompt h2 {
            font-size: 1.8rem;
            margin-bottom: var(--spacing-sm);
        }
        .login-prompt p {
            color: var(--color-text-secondary);
            max-width: 400px;
            margin: 0 auto var(--spacing-lg);
        }

        @media (max-width: 900px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
            .profile-card.full-width {
                grid-column: 1;
            }
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .profile-header .info .name {
                justify-content: center;
            }
            .profile-header .stats-quick {
                justify-content: center;
                width: 100%;
            }
        }
        @media (max-width: 480px) {
            .profile-header .avatar {
                width: 80px;
                height: 80px;
            }
            .profile-header .info .name {
                font-size: 1.4rem;
            }
            .profile-header .info .tier-display {
                font-size: 2rem;
            }
            .profile-header .stats-quick {
                gap: var(--spacing-md);
            }
            .stats-grid-profile {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <nav id="main-nav"></nav>

        <div class="profile-hero">
            <h1>👤 Player Profile</h1>
            <p>View your stats, tiers, and progression</p>
        </div>

        <div class="profile-container" id="profile-container">
            <!-- Login Prompt (shown when not authenticated) -->
            <div class="login-prompt" id="login-prompt" style="display:none;">
                <div class="icon">🔒</div>
                <h2>Login Required</h2>
                <p>Connect your Discord account to view your player profile and stats.</p>
                <button class="discord-btn" id="profileLoginBtn">💬 Login with Discord</button>
            </div>

            <!-- Profile Content (shown when authenticated) -->
            <div id="profile-content" style="display:none;">
                <!-- Loading State -->
                <div class="loading-spinner" id="profile-loading">
                    <div class="spinner"></div>
                    <p>Loading your profile...</p>
                </div>

                <!-- Profile Data -->
                <div id="profile-data" style="display:none;">
                    <!-- Header -->
                    <div class="profile-header" id="profile-header">
                        <!-- Filled by JS -->
                    </div>

                    <!-- Grid -->
                    <div class="profile-grid">
                        <!-- Gamemode Tiers -->
                        <div class="profile-card">
                            <h2>🎯 Gamemode Tiers <span class="badge">All 7</span></h2>
                            <div class="gamemode-tier-list" id="gamemode-tiers">
                                <!-- Filled by JS -->
                            </div>
                        </div>

                        <!-- Quick Stats -->
                        <div class="profile-card">
                            <h2>📊 Statistics <span class="badge">Live</span></h2>
                            <div class="stats-grid-profile" id="stats-grid">
                                <!-- Filled by JS -->
                            </div>
                        </div>

                        <!-- Tier History -->
                        <div class="profile-card full-width">
                            <h2>📜 Tier History</h2>
                            <div class="history-list" id="tier-history">
                                <!-- Filled by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer id="main-footer"></footer>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/backgrounds.js"></script>
    <script src="assets/js/stats-api.js"></script>
    <script>
        // ============================================================
        // PROFILE PAGE LOGIC
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const session = window.ATL_SESSION.current();
            const loginPrompt = document.getElementById('login-prompt');
            const profileContent = document.getElementById('profile-content');
            const profileLoading = document.getElementById('profile-loading');
            const profileData = document.getElementById('profile-data');
            const profileHeader = document.getElementById('profile-header');
            const gamemodeTiers = document.getElementById('gamemode-tiers');
            const statsGrid = document.getElementById('stats-grid');
            const tierHistory = document.getElementById('tier-history');

            // --- Login button ---
            document.getElementById('profileLoginBtn').addEventListener('click', function() {
                window.ATL_SESSION.loginWithDiscord();
            });

            // --- Check authentication ---
            if (!session.authenticated) {
                loginPrompt.style.display = 'block';
                profileContent.style.display = 'none';
                return;
            }

            // Show profile content
            loginPrompt.style.display = 'none';
            profileContent.style.display = 'block';
            profileLoading.style.display = 'block';
            profileData.style.display = 'none';

            // --- Load profile data ---
            async function loadProfile() {
                try {
                    const username = session.user.username;
                    
                    // Fetch player data from Frost Practice
                    let playerData = null;
                    try {
                        playerData = await window.FROST_STATS.getPlayerData(username);
                    } catch (e) {
                        // If player not found on Frost Practice, use Discord info
                        console.warn('Player not found on Frost Practice:', e);
                    }

                    // Build profile data
                    const profile = {
                        username: username,
                        discord: session.user.display || username,
                        discordId: session.user.id,
                        skin: `https://crafatar.com/avatars/${encodeURIComponent(username)}?size=120`,
                        overall: playerData?.overall || 'N/A',
                        stats: playerData?.stats || { wins: 0, losses: 0, kd: 0, elo: 0, games: 0, winRate: 0, streak: 0 },
                        gamemodes: playerData?.gamemodes || {},
                        role: session.role || 'Member'
                    };

                    // --- Render Header ---
                    const tierColor = window.ATL_DATA.TIER_COLORS[profile.overall] || '#94a3b8';
                    const roleBadge = window.ATL_roleBadge(profile.role) || '';

                    profileHeader.innerHTML = `
                        <div class="avatar">
                            <img src="${profile.skin}" 
                                 alt="Minecraft skin of ${profile.username}"
                                 onerror="this.src='${window.ATL_DATA.getSkinFallback()}'">
                        </div>
                        <div class="info">
                            <div class="name">
                                ${profile.username}
                                <span class="role-badge">${profile.role}</span>
                            </div>
                            <div class="discord">${profile.discord}</div>
                            <div class="tier-display" style="color: ${tierColor}">${profile.overall}</div>
                        </div>
                        <div class="stats-quick">
                            <div class="stat">
                                <div class="num">${profile.stats.wins}</div>
                                <div class="label">Wins</div>
                            </div>
                            <div class="stat">
                                <div class="num">${profile.stats.losses}</div>
                                <div class="label">Losses</div>
                            </div>
                            <div class="stat">
                                <div class="num">${profile.stats.kd}</div>
                                <div class="label">K/D</div>
                            </div>
                            <div class="stat">
                                <div class="num">${profile.stats.elo}</div>
                                <div class="label">ELO</div>
                            </div>
                        </div>
                    `;

                    // --- Render Gamemode Tiers ---
                    const gamemodes = window.ATL_DATA.GAMEMODES;
                    gamemodeTiers.innerHTML = gamemodes.map(gm => {
                        const data = profile.gamemodes[gm.id] || { tier: 'N/A' };
                        const tier = data.tier || 'N/A';
                        const color = window.ATL_DATA.TIER_COLORS[tier] || '#94a3b8';
                        return `
                            <div class="gamemode-tier-item">
                                <span class="gm">${gm.icon} ${gm.label}</span>
                                <span class="tier" style="color: ${color}">${tier}</span>
                            </div>
                        `;
                    }).join('');

                    // --- Render Stats Grid ---
                    statsGrid.innerHTML = `
                        <div class="stat-box">
                            <div class="num">${profile.stats.wins}</div>
                            <div class="label">Wins</div>
                        </div>
                        <div class="stat-box">
                            <div class="num">${profile.stats.losses}</div>
                            <div class="label">Losses</div>
                        </div>
                        <div class="stat-box">
                            <div class="num">${profile.stats.kd}</div>
                            <div class="label">K/D</div>
                        </div>
                        <div class="stat-box">
                            <div class="num">${profile.stats.elo}</div>
                            <div class="label">ELO</div>
                        </div>
                        <div class="stat-box">
                            <div class="num">${profile.stats.games}</div>
                            <div class="label">Games</div>
                        </div>
                        <div class="stat-box">
                            <div class="num">${profile.stats.winRate}%</div>
                            <div class="label">Win Rate</div>
                        </div>
                        <div class="stat-box">
                            <div class="num">${profile.stats.streak}</div>
                            <div class="label">Streak</div>
                        </div>
                    `;

                    // --- Render Tier History ---
                    // This would come from your tier_log store
                    const historyData = await window.ATL_SESSION.loadStore('tier_log', []);
                    const myHistory = historyData
                        .filter(h => h.player && h.player.toLowerCase() === profile.username.toLowerCase())
                        .sort((a, b) => new Date(b.date) - new Date(a.date));

                    if (myHistory.length === 0) {
                        tierHistory.innerHTML = `
                            <div class="no-data">
                                <div class="icon">📜</div>
                                <p>No tier history yet</p>
                            </div>
                        `;
                    } else {
                        tierHistory.innerHTML = myHistory.slice(0, 20).map(h => {
                            const gmLabel = window.ATL_DATA.getGamemodeLabel(h.gamemode);
                            const date = new Date(h.date).toLocaleDateString('en-US', {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric'
                            });
                            const color = window.ATL_DATA.TIER_COLORS[h.tier] || '#94a3b8';
                            return `
                                <div class="history-item">
                                    <span>${gmLabel}</span>
                                    <span class="change">
                                        <span class="old">${h.previous_tier || 'N/A'}</span>
                                        <span class="arrow">→</span>
                                        <span class="new" style="color: ${color}">${h.tier}</span>
                                    </span>
                                    <span class="date">${date}</span>
                                </div>
                            `;
                        }).join('');
                    }

                    // --- Show data ---
                    profileLoading.style.display = 'none';
                    profileData.style.display = 'block';

                } catch (error) {
                    console.error('Error loading profile:', error);
                    profileLoading.innerHTML = `
                        <div class="error-message">
                            <div class="icon">❌</div>
                            <p>Failed to load profile: ${error.message}</p>
                            <p style="font-size: 0.85rem; margin-top: 8px; color: var(--color-text-secondary)">
                                Make sure Frost Practice server is running
                            </p>
                        </div>
                    `;
                }
            }

            loadProfile();

            // --- Handle session updates ---
            window.addEventListener('session-update', function(e) {
                if (!e.detail.authenticated) {
                    window.location.reload();
                }
            });
        });
    </script>
</body>
</html>
